services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reloop
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 4000
      # Container-to-container traffic uses the Docker network's internal
      # service name/port (postgres:5432) — not the 5433 host mapping above,
      # which only matters for connections from outside Docker (psql, Prisma
      # Studio, `pnpm dev` run directly on the host).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reloop
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 1d
      STORAGE_DRIVER: local
      UPLOADS_DIR: ./uploads
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/apps/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # The browser (not the container) calls this URL, so it must be
        # reachable from the host — the Docker-internal service name
        # ("backend") would only resolve inside the compose network.
        VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
